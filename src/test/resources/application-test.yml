spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

jwt:
  secret: "test-secret-key-that-is-at-least-32-characters-long!!"
  expiration-ms: 86400000

cors:
  allowed-origins: http://localhost:5173

sendgrid:
  api-key: disabled
  from-email: test@example.com

cloudinary:
  cloud-name: disabled
  api-key: disabled
  api-secret: disabled

app:
  frontend-url: http://localhost:5173
